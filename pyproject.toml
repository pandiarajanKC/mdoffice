[project]
name = "mdoffice"
version = "0.1.0"
description = "MD Office Flask application"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.0",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.2.2",
    "Flask-Migrate==4.0.7",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.0.36",
    "pyodbc==5.2.0",
    "python-dotenv==1.0.1",
    "Werkzeug==3.1.3",
    "email-validator==2.2.0",
    "waitress==3.0.2",
    "google-auth==2.57.1",
    "google-auth-oauthlib==1.4.1",
    "google-api-python-client==2.200.0",
    "cryptography==50.0.1",
    "APScheduler==3.11.3",
    "openpyxl==3.1.5",
    "openai==3.8.0",
]

[tool.vercel]
entrypoint = "run:app"
